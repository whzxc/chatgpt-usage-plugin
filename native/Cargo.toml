[package]
name = "chatgpt-usage-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "chatgpt-usage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }


[profile.dev]
debug = 1
incremental = false
opt-level = 1

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.chatgpt-usage-plugin]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
