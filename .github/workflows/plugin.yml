name: Plugin
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the matching version tag to the stable marketplace
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: usage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run plugin:build
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: usage-marketplace-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist/artifacts
          merge-multiple: true
      - name: Assemble marketplace
        run: node tooling/marketplace.mjs assemble dist/artifacts dist/marketplace
      - name: Publish marketplace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          node tooling/marketplace.mjs publish dist/marketplace
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/artifacts/* --verify-tag --title "ChatGPT Usage $GITHUB_REF_NAME" --notes-file docs/release-notes.md
